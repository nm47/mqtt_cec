services:
  mqtt-cec:
    build: .
    container_name: mqtt_cec_controller

    # Restart policy: unless-stopped
    # - Restarts on crash/failure
    # - Restarts on system reboot
    # - Does NOT restart if explicitly stopped by user
    restart: unless-stopped

    # Kernel HDMI-CEC adapter (vc4-hdmi on a Raspberry Pi with KMS)
    devices:
      - "/dev/cec0:/dev/cec0"

    # Environment variables from .env file
    env_file:
      - .env

    # Mount source code as volume for live editing
    volumes:
      - ./src:/app/src

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
